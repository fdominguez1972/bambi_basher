<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trail camera image processing system with automated wildlife detection and species identification">
  <meta name="theme-color" content="#2c5f2d">

  <title>Bambi Basher - Trail Camera Analysis</title>

  <!-- Preload critical resources -->
  <link rel="preload" href="/src/styles/variables.css" as="style">
  <link rel="preload" href="/src/styles/reset.css" as="style">
  <link rel="preload" href="/src/styles/global.css" as="style">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/variables.css">
  <link rel="stylesheet" href="/src/styles/reset.css">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/accessibility.css">

  <!-- Leaflet CSS for maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="anonymous">
</head>
<body>
  <!-- Skip to main content link for accessibility -->
  <a href="#main-content" class="skip-link sr-only">Skip to main content</a>

  <!-- Application container -->
  <div id="app">
    <!-- Header will be mounted here -->
    <div id="header"></div>

    <!-- Main content area -->
    <main id="main-content" role="main">
      <!-- Page content will be mounted here by router -->
      <div id="page-content"></div>
    </main>

    <!-- Footer will be mounted here -->
    <div id="footer"></div>
  </div>

  <!-- Notification container for toast messages -->
  <div id="notification-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Modal container for dialogs -->
  <div id="modal-container"></div>

  <!-- Application entry point -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
